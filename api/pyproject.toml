[project]
name = "agent-studio-api"
version = "0.1.0"
description = "Agent Studio Python modular-monolith backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.31,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.44,<3",
  "psycopg2-binary>=2.9.9,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "cryptography>=43,<46",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.12,<1",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "anthropic>=0.36,<1",
  "openai>=1.51,<2",
  "mcp>=1.24,<2",
  "pypdf>=5,<7",
  "supabase>=2.9,<3",
  "croniter>=3,<4"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.22,<1",
  "testcontainers[postgres]>=4.9,<5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
