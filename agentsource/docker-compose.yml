version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentsource
      POSTGRES_USER: agentsource
      POSTGRES_PASSWORD: agentsource
    ports:
      - "5433:5432"
    volumes:
      - agentsource-postgres:/var/lib/postgresql/data

  mcp-server-example:
    build: ./mcp-server-example
    ports:
      - "7100:7100"

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: mock
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/agentsource
      POSTGRES_USER: agentsource
      POSTGRES_PASSWORD: agentsource
      LLM_API_KEY: ${LLM_API_KEY:-}
      MCP_SERVER_EXAMPLE_URL: http://mcp-server-example:7100
    depends_on:
      - postgres
      - mcp-server-example
    ports:
      - "8080:8080"

  ui:
    build: ./ui
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  agentsource-postgres:
